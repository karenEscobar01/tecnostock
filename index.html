<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6efff">
    <title>TecnoStock - Tienda Tecnológica</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="main-header">
        <div class="header-container">
            <h1>TecnoStock</h1>
            <div class="cart-summary-badge" aria-live="polite">
                <span aria-hidden="true">🛒</span> Carrito: <span id="header-cart-count">0</span> unidades
            </div>
        </div>
    </header>

    <main class="container">
        <section class="filters-section">
            <div class="filter-group">
                <label for="search-input">Buscar</label>
                <input type="search" id="search-input" placeholder="Buscar por nombre o descripción...">
            </div>

            <div class="filter-group">
                <label for="category-select">Categoría</label>
                <select id="category-select">
                    <option value="">Todas las categorías</option>
                </select>
            </div>

            <div class="filter-group checkbox-group">
                <label>
                    <input type="checkbox" id="available-checkbox"> Solo disponibles
                </label>
            </div>

            <div class="filter-group">
                <label for="sort-select">Ordenar por precio</label>
                <select id="sort-select">
                    <option value="">Sin ordenar</option>
                    <option value="asc">Menor a mayor</option>
                    <option value="desc">Mayor a menor</option>
                </select>
            </div>

            <button id="clear-filters-btn" class="btn btn-secondary">Limpiar filtros</button>
        </section>

        <div id="notification-area" aria-live="polite"></div>

        <div class="app-layout">
            <section class="catalog-section" aria-labelledby="catalog-title">
                <h2 id="catalog-title">Catálogo de productos</h2>
                <product-list id="product-list-component"></product-list>
            </section>

            <aside class="cart-section" aria-labelledby="cart-title">
                <h2 id="cart-title">Tu carrito</h2>
                <shopping-cart id="shopping-cart-component"></shopping-cart>
                <button id="checkout-btn" class="btn btn-primary btn-block">Confirmar pedido</button>
            </aside>
        </div>
    </main>

    <dialog id="order-modal" class="modal" aria-labelledby="modal-title">
        <div class="modal-content">
            <div id="modal-body"></div>
            <button id="close-modal-btn" class="btn btn-secondary">Cerrar</button>
        </div>
    </dialog>

    <script type="module" src="js/app.js"></script>
</body>
</html>
